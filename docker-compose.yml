# GastroHub — ambiente local
#
#   docker compose up -d                          # somente PostgreSQL (fluxo diário)
#   docker compose --profile app up -d --build    # stack completa em containers
#
# Variáveis lidas do .env (gerado por `pnpm env:init`, não versionado).

name: gastrohub

services:
  postgres:
    image: postgres:18.6
    container_name: gastrohub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (pnpm env:init)}
      GASTROHUB_OWNER_PASSWORD: ${GASTROHUB_OWNER_PASSWORD:?defina GASTROHUB_OWNER_PASSWORD no .env}
      GASTROHUB_APP_PASSWORD: ${GASTROHUB_APP_PASSWORD:?defina GASTROHUB_APP_PASSWORD no .env}
    ports:
      # Somente na interface local: o banco não fica exposto na rede.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - gastrohub_pgdata:/var/lib/postgresql
      - ./infra/database/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Via TCP: durante o init o servidor temporário só escuta no socket local,
      # então o container só fica "healthy" depois que o init terminar.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d gastrohub']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  gastrohub_pgdata:
    name: gastrohub_pgdata
